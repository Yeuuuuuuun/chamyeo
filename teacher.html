<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>참여마당 교사 화면</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="mode-note" data-mode-note hidden></div>
<header class="top">
  <div class="wrap">
    <div class="brand" id="brand"><div><b data-site-name></b><span class="practice">교사 화면</span><br><small>진행 단계 바꾸기 · 제안 관리 · 투표 집계</small></div></div>
    <div class="me"><a class="btn ghost small" href="index.html" target="_blank" rel="noopener" style="text-decoration:none">학생 화면 열기</a><button type="button" id="logoutBtn" hidden>나가기</button></div>
  </div>
</header>
<main class="wrap" id="view"></main>
<div id="modalRoot"></div>

<script src="config.js"></script>
<script src="core.js"></script>
<script src="common.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = escapeHtml;
const T = { pw: sessionStorage.getItem("ep-teacher") || "", data: null, phase: null };
$("#brand").insertAdjacentHTML("afterbegin", BRAND_SVG);

function showLogin(msg) {
  $("#logoutBtn").hidden = true;
  $("#view").innerHTML = `<div class="panel login"><h2>선생님 확인</h2>
    <form id="lf"><div class="field"><label for="pw">교사 비밀번호</label><input id="pw" type="password" autocomplete="current-password"></div>
    <div class="err" id="lErr">${esc(msg || "")}</div>
    <small style="color:var(--muted);display:block;margin-bottom:12px">${Api.isLocal ? "연습 모드 비밀번호는 1234예요." : "Code.gs 맨 위 TEACHER_PASSWORD 에 적은 비밀번호예요."}</small>
    <button class="btn" type="submit" style="width:100%">들어가기</button></form></div>`;
  $("#pw").focus();
  $("#lf").onsubmit = async e => {
    e.preventDefault();
    T.pw = $("#pw").value;
    const ok = await refresh(true);
    if (ok) { try { sessionStorage.setItem("ep-teacher", T.pw); } catch (err) {} }
  };
}

async function refresh(fromLogin) {
  if (!T.pw) { showLogin(); return false; }
  let d;
  try { d = await Api.call({ action: "state", pw: T.pw }); }
  catch (e) { if (fromLogin || !T.data) showLogin("서버에 연결하지 못했어요. config.js 의 apiUrl 을 확인해 주세요."); return false; }
  if (!d.ok) {
    T.pw = ""; try { sessionStorage.removeItem("ep-teacher"); } catch (e) {}
    showLogin(d.error); return false;
  }
  T.data = d;
  if (T.phase === null) T.phase = d.settings.phase;
  render();
  return true;
}

async function act(body, okMsg) {
  try {
    const r = await Api.call(Object.assign({ pw: T.pw }, body));
    if (!r.ok) toast(r.error || "저장하지 못했어요.");
    else if (okMsg) toast(okMsg);
  } catch (e) { toast("저장하지 못했어요. 인터넷 연결을 확인해 주세요."); }
  T.phase = null;
  await refresh();
}

function render() {
  $("#logoutBtn").hidden = false;
  const d = T.data, st = d.settings;
  const ranked = rankProposals(d), voters = d.voters;
  const props = d.proposals.slice().sort((a, b) => b.createdAt - a.createdAt);
  const active = document.activeElement && document.activeElement.closest("#settingsForm");
  if (active && $("#settingsForm")) { renderLists(); return; } // 설정을 고치는 중에는 그 칸을 건드리지 않아요
  $("#view").innerHTML = `
  <div style="padding-block:28px 60px;display:grid;gap:24px">
    <div class="stats" style="margin:0">
      <div><span>제안</span><strong>${d.proposals.length}</strong><em>건</em></div>
      <div><span>투표 후보</span><strong>${ranked.length}</strong><em>건</em></div>
      <div><span>투표 참여</span><strong>${voters}</strong><em>명</em></div>
    </div>
    <div class="t-grid">
      <section class="panel">
        <h2>진행 설정</h2>
        <form id="settingsForm">
          <div class="field"><label>진행 단계 <small>(지금: ${PHASE_NAMES[st.phase]})</small></label>
            <div class="seg">${Object.keys(PHASE_NAMES).map(k => `<button type="button" data-ph="${k}" aria-pressed="${k === T.phase}">${PHASE_NAMES[k]}</button>`).join("")}</div>
            <small>투표를 시작하면 새 제안과 공감이 멈춰요. ‘결과 발표’를 고르면 학생 화면에 결과가 나와요.</small></div>
          <div class="field"><label for="sThr">투표 후보가 되는 공감 수</label><input id="sThr" type="number" min="1" max="100" value="${st.threshold}"></div>
          <div class="field"><label for="sMax">한 사람이 고를 수 있는 제안 수</label><input id="sMax" type="number" min="1" max="10" value="${st.voteMax}"></div>
          <button class="btn" type="submit">설정 저장</button>
        </form>
        <div class="section" style="margin-top:22px">
          <h3>투표 다시 하기</h3>
          <p style="margin:4px 0 12px;color:var(--muted);font-size:14px">지금까지 모인 표 ${voters}명분을 모두 지워요. 제안과 공감은 그대로 남아요.</p>
          <div id="resetBox"><button class="btn danger small" type="button" id="resetBtn">모든 표 지우기</button></div>
        </div>
      </section>
      <section class="panel">
        <h2>투표 집계 <small class="refresh">(선생님만 보여요 · ${CFG.refreshSeconds}초마다 새로고침)</small></h2>
        <div id="tally"></div>
      </section>
    </div>
    <section class="panel">
      <h2>제안 관리</h2>
      <p style="margin:-6px 0 12px;color:var(--muted);font-size:14px">${esc(CFG.regionName)}와 관계없는 제안이나 알맞지 않은 글·사진은 지워 주세요. 지우면 그 제안의 공감, 댓글, 사진도 함께 지워져요.</p>
      <div id="propList"></div>
    </section>
    <section class="panel">
      <h2>댓글 관리</h2>
      <div id="commentList"></div>
    </section>
  </div>`;
  document.querySelectorAll("[data-ph]").forEach(b => b.onclick = () => {
    T.phase = b.dataset.ph;
    document.querySelectorAll("[data-ph]").forEach(x => x.setAttribute("aria-pressed", x.dataset.ph === T.phase));
  });
  $("#settingsForm").onsubmit = e => {
    e.preventDefault();
    act({ action: "settings", phase: T.phase, threshold: $("#sThr").value, voteMax: $("#sMax").value }, "설정을 저장했어요.");
  };
  $("#resetBtn").onclick = () => {
    $("#resetBox").innerHTML = `<span class="confirm">정말 모든 표를 지울까요? <button class="btn danger small" type="button" id="rYes">지우기</button><button class="btn ghost small" type="button" id="rNo">취소</button></span>`;
    $("#rNo").onclick = render;
    $("#rYes").onclick = () => act({ action: "resetVotes" }, "모든 표를 지웠어요.");
  };
  renderLists();
}

function renderLists() {
  const d = T.data, ranked = rankProposals(d), voters = d.voters;
  const max = Math.max(1, ...ranked.map(r => r.v));
  $("#tally").innerHTML = ranked.length ? `<div class="podium">${ranked.map(r => `<div class="res ${r.rank === 1 && r.v > 0 ? "win" : ""}">
      <div class="rank">${r.rank}위</div><div style="min-width:0"><h3>[${esc(r.p.category)}] ${esc(r.p.title)} <span class="dong">${esc(r.p.dong)}</span></h3><div class="bar"><b style="width:${r.v / max * 100}%"></b></div></div>
      <div class="num"><strong>${r.v}</strong>표<span>${voters ? Math.round(r.v / voters * 100) : 0}%</span></div></div>`).join("")}</div>`
    : `<div class="empty"><strong>아직 투표 후보가 없어요</strong>공감 ${d.settings.threshold}개 이상을 받은 제안이 후보가 돼요.</div>`;

  const props = d.proposals.slice().sort((a, b) => b.createdAt - a.createdAt);
  $("#propList").innerHTML = props.length ? `<div class="table-wrap"><table class="list"><thead><tr><th>동</th><th>분류</th><th>제목 · 내용</th><th>작성자</th><th>공감</th><th>댓글</th><th></th></tr></thead><tbody>
    ${props.map(p => `<tr><td>${esc(p.dong)}</td><td>${esc(p.category)}</td><td><b>${esc(p.title)}</b><br><span style="color:var(--muted)">${esc(p.body)}</span>${(p.images || []).length ? `<div class="t-photos">${p.images.map((im, i) => `<div class="photo" data-img="${esc(im)}" data-alt="${esc(p.title)} 사진 ${i + 1}">불러오는 중…</div>`).join("")}</div>` : ""}</td>
      <td>${esc(p.author)}<br><span class="refresh">${formatTime(p.createdAt)}</span></td><td class="n">${p.likes}</td><td class="n">${p.comments}</td>
      <td data-box="${esc(p.id)}"><button class="btn danger small" type="button" data-delp="${esc(p.id)}">지우기</button></td></tr>`).join("")}
    </tbody></table></div>` : `<div class="empty"><strong>아직 제안이 없어요</strong>학생 화면에서 제안이 올라오면 여기에 보여요.</div>`;
  fillImages($("#propList"));
  document.querySelectorAll("[data-delp]").forEach(b => b.onclick = () => {
    const cell = b.parentElement, id = b.dataset.delp;
    cell.innerHTML = `<span class="confirm"><button class="btn danger small" type="button">정말 지우기</button><button class="link" type="button">취소</button></span>`;
    const [yes, no] = cell.querySelectorAll("button");
    yes.onclick = () => act({ action: "deleteProposal", pid: id }, "제안을 지웠어요.");
    no.onclick = renderLists;
  });

  const title = {}; d.proposals.forEach(p => { title[p.id] = p.title; });
  const cs = d.comments.slice().sort((a, b) => b.createdAt - a.createdAt);
  $("#commentList").innerHTML = cs.length ? `<div class="table-wrap"><table class="list"><thead><tr><th>제안</th><th>댓글</th><th>작성자</th><th></th></tr></thead><tbody>
    ${cs.map(c => `<tr><td>${esc(title[c.pid] || "")}</td><td>${esc(c.text)}</td><td>${esc(c.author)}<br><span class="refresh">${formatTime(c.createdAt)}</span></td>
      <td><button class="btn danger small" type="button" data-delc="${esc(c.id)}">지우기</button></td></tr>`).join("")}
    </tbody></table></div>` : `<p style="color:var(--muted);margin:0">아직 댓글이 없어요.</p>`;
  document.querySelectorAll("[data-delc]").forEach(b => b.onclick = () => act({ action: "deleteComment", cid: b.dataset.delc }, "댓글을 지웠어요."));
}

$("#logoutBtn").onclick = () => { T.pw = ""; T.data = null; try { sessionStorage.removeItem("ep-teacher"); } catch (e) {} showLogin(); };
refresh();
startPolling(() => { if (T.pw && T.data && !document.querySelector("[data-box] .confirm, #resetBox .confirm")) refresh(); });
</script>
</body>
</html>
